# .github/workflows/reusable-ci.yml
# Centralized, versioned reusable CI workflow with structured telemetry output
name: Reusable Component CI Pipeline

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: "22"
      run-tests:
        required: false
        type: boolean
        default: true
      run-security-scan:
        required: false
        type: boolean
        default: true
    secrets:
      SONAR_TOKEN:
        required: false
      REGISTRY_TOKEN:
        required: false
    outputs:
      artifact-sha:
        description: "Commit SHA of validated artifact"
        value: ${{ jobs.build.outputs.artifact-sha }}
      build-status:
        description: "Status of component build"
        value: ${{ jobs.build.outputs.status }}

permissions:
  contents: read
  security-events: write

jobs:
  build:
    name: Build & Verify Component
    runs-on: ubuntu-latest
    outputs:
      artifact-sha: ${{ steps.telemetry.outputs.sha }}
      status: ${{ job.status }}
    steps:
      - name: Checkout Component Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Runtime Environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Execute Lint & Typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Execute Unit & Integration Tests
        if: ${{ inputs.run-tests }}
        run: npm test

      - name: Emit Structured Telemetry for Observability
        id: telemetry
        if: always()
        run: |
          echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "workflow_ref=${{ github.workflow_ref }}" >> $GITHUB_OUTPUT
          echo "caller_repo=${{ github.repository }}" >> $GITHUB_OUTPUT
          echo "actor=${{ github.actor }}" >> $GITHUB_OUTPUT
          echo "status=${{ job.status }}" >> $GITHUB_OUTPUT
          echo "run_id=${{ github.run_id }}" >> $GITHUB_OUTPUT
