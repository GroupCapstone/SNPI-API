# GitHub Actions Azure Private Networking Configuration Template
enterprise:
  name: snp-sms-enterprise
  organization: snp-sms
  businessId: "12345678"

networking:
  vnetName: vnet-github-runners
  vnetCidr: 10.240.0.0/16
  subnetName: snet-github-runners
  subnetCidr: 10.240.1.0/24
  delegationService: GitHub.Network/networkSettings
  maxConcurrency: 100
  supportedOperatingSystems:
    - linux
    - windows

firewall:
  applicationRuleFqdns:
    - github.com
    - "*.github.com"
    - "*.githubusercontent.com"
    - "*.blob.core.windows.net"
    - ghcr.io
    - "*.ghcr.io"
    - "*.githubassets.com"
    - github-cloud.s3.amazonaws.com
