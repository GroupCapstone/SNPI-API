# arc-runner-scaleset-values.yaml
# Production Helm values for Autoscaling Runner Set
# Release: gha-runner-scale-set

githubConfigUrl: "https://github.com/Tan-Saphea/SNPI-SMS"
githubConfigSecret: "arc-github-app-secret"

# Scaling Configuration
minRunners: 0
maxRunners: 20

# Single Label Architecture: makes job targeting deterministic and debuggable
runnerScaleSetName: "snp-sms-runner-standard"

# PRODUCTION MANDATE: comment out containerMode and define explicit template.spec
# containerMode:
#   type: "dind"

template:
  spec:
    # Anti-spot instance policy: strictly target dedicated on-demand build nodes
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: "karpenter.sh/capacity-type"
                  operator: "NotIn"
                  values: ["spot"]
                - key: "node.kubernetes.io/instance-type"
                  operator: "In"
                  values: ["m6i.xlarge", "m6i.2xlarge", "c6i.2xlarge"]

    tolerations:
      - key: "workload"
        operator: "Equal"
        value: "github-runner"
        effect: "NoSchedule"

    initContainers:
      - name: init-dind-externals
        image: ghcr.io/actions/actions-runner:latest
        command: ["cp", "-r", "-u", "/home/runner/externals/.", "/home/runner/tmpDir/"]
        volumeMounts:
          - name: dind-externals
            mountPath: /home/runner/tmpDir

    containers:
      # 1. Unprivileged Runner Container
      - name: runner
        image: ghcr.io/actions/actions-runner:2.321.0
        command: ["/home/runner/run.sh"]
        env:
          - name: DOCKER_HOST
            value: "tcp://localhost:2375"
          - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
            value: "true"
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1001
        resources:
          requests:
            cpu: "2000m"
            memory: "4096Mi"
          limits:
            cpu: "2000m"
            memory: "4096Mi"
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-externals
            mountPath: /home/runner/externals

      # 2. Privileged DinD Sidecar (strictly isolated per runner pod)
      - name: dind
        image: docker:27-dind
        securityContext:
          privileged: true
          allowPrivilegeEscalation: true
          runAsUser: 0
        resources:
          requests:
            cpu: "1000m"
            memory: "2048Mi"
          limits:
            cpu: "1000m"
            memory: "2048Mi"
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-storage
            mountPath: /var/lib/docker

    volumes:
      - name: work
        emptyDir: {}
      - name: dind-externals
        emptyDir: {}
      - name: dind-storage
        emptyDir: {}
