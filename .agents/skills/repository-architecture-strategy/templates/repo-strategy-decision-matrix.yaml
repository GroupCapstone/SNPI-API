# Repository Architecture Strategy Manifest Template
# Framework Alignment: GitHub Well-Architected Framework (Architecture Strategy)
version: "1.0"

repositoryStrategy:
  type: monorepo
  selectedArchitecture: "npm-workspaces-modular-monolith"
  rationale: >
    Evaluated against Monorepo vs Polyrepo trade-offs based on team size, contract synchronization,
    and release atomicity requirements.

boundaries:
  workspaces:
    - apps/backend
    - apps/frontend
    - packages/shared
    - packages/tsconfig
    - packages/eslint-config
  boundaryRules:
    - "apps/* must never import directly from sibling apps/*"
    - "apps/* can only consume shared types, contracts, DTOs, and schemas through packages/shared"
    - "packages/shared must remain completely framework-agnostic with zero runtime dependencies"
    - "packages/tsconfig and packages/eslint-config provide canonical root inheritance"

circularDependencyGuards:
  enforced: true
  maxAllowedCycles: 0

dependencyManagement:
  tool: "npm-workspaces"
  lockfilePolicy: "deterministic-package-lock"
  rootHoistPolicy: "dev-dependencies-hoisted"

cicdOptimization:
  incrementalBuilds: true
  pathFiltering: true
  cacheStrategy: "actions-cache-and-npm-cache"

alternateDeploymentContinuity:
  breakGlassRunbook: "docs/runbooks/break-glass-deployment.md"
  independentAuthentication: true
  portableDeploymentScript: "scripts/deploy-production.sh"
  reconciliationAuditRequired: true
