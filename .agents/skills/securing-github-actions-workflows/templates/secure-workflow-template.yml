name: Hardened Enterprise Workflow Template

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Invariant: Root-level permissions zeroed to enforce explicit job-level declarations
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: Lint & Unit Testing
    runs-on: ubuntu-latest
    # Explicit least-privilege permissions for read-only CI
    permissions:
      contents: read

    steps:
      # Pinned to immutable full-length commit SHA
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js Runtime
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Static Analysis & Tests
        run: |
          npm run lint
          npm run typecheck
          npm run test:api

  deploy-cloud:
    name: OIDC Cloud Deployment
    needs: test-and-lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Explicit permissions for OIDC token generation
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Authenticate via OIDC (No Static Secrets)
        # Safe environment mapping prevents workflow injection
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          echo "Executing OIDC authenticated deployment for commit: $WORKFLOW_SHA"
