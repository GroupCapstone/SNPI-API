# .github/workflows/resilience-mirror-sync.yml
# Automated synchronization job pushing narrow deployable refs to independent failure domain mirror

name: Repository Resilience Mirror Sync

on:
  schedule:
    # Run every 30 minutes
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force-sync:
        type: boolean
        description: "Force sync ignoring cache"
        default: false

permissions:
  contents: read

jobs:
  sync-to-mirror:
    name: Sync Narrow Refs to Mirror
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Out-of-Band Sync Lock
        id: lock-check
        run: |
          echo "Checking out-of-band lock state..."
          # Mock / actual check to out-of-band lock provider
          LOCK_STATUS=$(curl -fsSL -m 10 "https://status.snpi.edu.kh/api/v1/sync-lock/snp-sms-monorepo" || echo "UNLOCKED")
          if [ "$LOCK_STATUS" = "LOCKED" ]; then
            echo "[LOCKED] Out-of-band lock active. Halting sync to prevent overwriting active incident emergency hotfixes."
            exit 0
          fi
          echo "[UNLOCKED] Lock clear. Proceeding with mirror synchronization."

      - name: Synchronize Narrow Refspecs to Mirror Target
        env:
          MIRROR_REMOTE_URL: ${{ secrets.RESILIENCE_MIRROR_REMOTE_URL }}
          MIRROR_AUTH_TOKEN: ${{ secrets.RESILIENCE_MIRROR_AUTH_TOKEN }}
        run: |
          if [ -z "$MIRROR_REMOTE_URL" ]; then
            echo "[SKIPPED] RESILIENCE_MIRROR_REMOTE_URL not configured. Running dry-run validation."
            git show-ref --heads --tags
            exit 0
          fi

          # Configure authenticated mirror remote in separate failure domain
          TARGET_URL=$(echo "$MIRROR_REMOTE_URL" | sed "s#https://#https://oauth2:${MIRROR_AUTH_TOKEN}@#")
          git remote add mirror "$TARGET_URL" || git remote set-url mirror "$TARGET_URL"

          echo "Pushing default branch and release tags..."
          git push mirror +refs/heads/main:refs/heads/main
          git push mirror +refs/tags/*:refs/tags/*

          echo "[COMPLETED] Resiliency mirror sync successful."
