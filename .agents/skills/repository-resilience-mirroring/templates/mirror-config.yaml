# mirror-config.yaml
# Production Configuration for Repository Resilience Mirroring
# Target: Emergency Break-Glass Deployments

version: "1.0.0"

repositories:
  - id: "snp-sms-monorepo"
    primary:
      provider: "github-cloud"
      repo: "Tan-Saphea/SNPI-SMS"
      url: "https://github.com/Tan-Saphea/SNPI-SMS.git"
      defaultBranch: "main"

    mirror:
      provider: "independent-ghes-or-gitlab"
      repo: "snp-resilience/SNPI-SMS"
      url: "https://mirror-git.snpi.edu.kh/snp-resilience/SNPI-SMS.git"
      failureDomain: "ap-southeast-1-onprem-dc"
      visibility: "private"

    # Narrow Refspec Standard: mirror only what is needed for emergency deployment
    syncScope:
      refspecs:
        - "+refs/heads/main:refs/heads/main"
        - "+refs/tags/*:refs/tags/*"
      excludeBlobsGreaterThanMb: 100

    sla:
      maxStalenessMinutes: 30 # RPO: Alert if mirror lag exceeds 30m
      activationTimeMinutes: 15 # RTO: Time to initiate build from mirror

    lock:
      # Out-of-band synchronization lock (checks before push to avoid overwriting hotfixes)
      checkUrl: "https://status.snpi.edu.kh/api/v1/sync-lock/snp-sms-monorepo"
      method: "GET"
      expectedActiveValue: "UNLOCKED"

    contacts:
      syncOwner: "devops-leads@snp.edu.kh"
      emergencyApprovers: ["lead-architect@snp.edu.kh", "security-lead@snp.edu.kh"]
