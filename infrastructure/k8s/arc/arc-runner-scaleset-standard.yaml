# arc-runner-scaleset-standard.yaml
# Production Autoscaling Runner Set for standard monorepo CI/CD workloads
# Target Namespace: arc-runners

githubConfigUrl: 'https://github.com/Tan-Saphea/SNPI-SMS'
githubConfigSecret: 'arc-github-app-secret'

minRunners: 0
maxRunners: 15

# Single Label for deterministic job targeting
runnerScaleSetName: 'snp-sms-runner-standard'

# Explicit template.spec enforced (containerMode disabled)
template:
  spec:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: 'karpenter.sh/capacity-type'
                  operator: 'NotIn'
                  values: ['spot']
                - key: 'node.kubernetes.io/instance-type'
                  operator: 'In'
                  values: ['m6i.xlarge', 'm6i.2xlarge', 'c6i.2xlarge']

    tolerations:
      - key: 'workload'
        operator: 'Equal'
        value: 'github-runner'
        effect: 'NoSchedule'

    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:2.321.0
        command: ['/home/runner/run.sh']
        env:
          - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
            value: 'true'
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1001
        resources:
          requests:
            cpu: '2000m'
            memory: '4096Mi'
          limits:
            cpu: '2000m'
            memory: '4096Mi'
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work

    volumes:
      - name: work
        emptyDir: {}
