global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'snp-sms-api'
    metrics_path: '/api/v1/health'
    static_configs:
      - targets: ['host.docker.internal:4000']
        labels:
          app: 'snp-sms-backend'
          environment: 'production'

  - job_name: 'mongodb'
    static_configs:
      - targets: ['host.docker.internal:9216']
        labels:
          app: 'mongodb-replica-set'
