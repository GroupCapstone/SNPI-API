apiVersion: apps/v1
kind: Deployment
metadata:
  name: snp-sms-backend
  namespace: snp-sms
  labels:
    app: snp-sms-backend
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: snp-sms-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: snp-sms-backend
        component: api
    spec:
      containers:
        - name: backend
          image: ghcr.io/tan-saphea/snp-integrated-multi-branch-school-management-system/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
              name: http
          envFrom:
            - configMapRef:
                name: snp-sms-config
            - secretRef:
                name: snp-sms-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: snp-sms-backend-service
  namespace: snp-sms
  labels:
    app: snp-sms-backend
spec:
  type: ClusterIP
  selector:
    app: snp-sms-backend
  ports:
    - port: 4000
      targetPort: http
      name: http
