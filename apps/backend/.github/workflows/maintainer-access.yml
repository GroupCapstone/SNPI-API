name: Maintainer Access

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  approved-maintainer:
    name: approved-maintainer
    runs-on: ubuntu-latest
    env:
      PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
    steps:
      - name: Check out trusted base policy
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Check immutable maintainer account ID
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const policy = JSON.parse(fs.readFileSync('.github/maintainers.json', 'utf8'));
          const approvedIds = new Set(policy.accountIds.map(String));
          const authorId = String(process.env.PR_AUTHOR_ID);

          if (!approvedIds.has(authorId)) {
            console.error('Pull request author account ID is not approved.');
            process.exit(1);
          }

          console.log('Authorized maintainer account.');
          NODE
