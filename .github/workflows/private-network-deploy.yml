name: Private Network Deployment & Integration

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Target deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      run_smoke_tests:
        description: 'Execute internal private smoke tests'
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: private-deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-private-networking:
    name: Private VNet Pre-Flight Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Audit Azure Private Networking Architecture
        run: npm run verify:private-network

  internal-service-integration:
    name: Internal VNet Workload Execution
    needs: validate-private-networking
    # Targets the Azure VNet injected larger runner group
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: SNPI-API Typecheck & Build
        run: |
          npm run typecheck
          npm run build
        env:
          NODE_ENV: production

      - name: Execute Internal Smoke & API Tests
        if: ${{ github.event.inputs.run_smoke_tests == 'true' || github.event_name == 'push' }}
        run: |
          echo "[VNET] Running internal API test suite over private network..."
          npm run test:api
        env:
          NODE_ENV: test
          PORT: 5001
