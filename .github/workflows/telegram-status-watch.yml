name: Telegram Repository Status & Security Watcher

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    types: [opened, closed, reopened]
  release:
    types: [published]
  workflow_run:
    workflows: ['Monorepo CI', 'Security & Compliance Audit']
    types: [completed]

permissions:
  contents: read
  security-events: read

jobs:
  telegram-alert:
    name: Dispatch Telegram Real-Time Alert
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract Metadata & Dispatch Alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_BOT__TOKEN || '9276848178:AAH3410AUju4t6MbUXkjThK_NTXsL9ellqU' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '6600489302' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Resolve Version from package.json
          PKG_VERSION=$(node -p "require('./package.json').version || '0.0.0'")
          
          # 2. Resolve Developer & Commit Info
          COMMIT_HASH="${{ github.sha }}"
          SHORT_HASH="${COMMIT_HASH:0:7}"
          DEV_NAME="${{ github.event.head_commit.author.name || github.actor }}"
          DEV_EMAIL="${{ github.event.head_commit.author.email || 'developer@snpi.edu.kh' }}"
          RAW_MSG="${{ github.event.head_commit.message || 'Automated repository workflow sync' }}"
          COMMIT_MSG=$(echo "$RAW_MSG" | head -n 1)

          # 3. Resolve Security Quality Alerts (Dependabot)
          OPEN_ALERTS=0
          if command -v gh >/dev/null 2>&1; then
            OPEN_ALERTS=$(gh api "repos/${{ github.repository }}/dependabot/alerts" --jq '[.[] | select(.state=="open")] | length' 2>/dev/null || echo "0")
          fi
          SEC_SUMMARY="${OPEN_ALERTS} open advisories"
          if [ "$OPEN_ALERTS" -eq 0 ]; then
            SEC_SUMMARY="0 alerts (clean)"
          fi

          # 4. Human-readable timestamp
          HUMAN_TIME=$(date -u +'%d %b %Y, %I:%M %p UTC')

          # 5. Determine Event Type & Format Payload
          EVENT_NAME="${{ github.event_name }}"
          
          if [ "$EVENT_NAME" = "release" ]; then
            TAG_NAME="${{ github.event.release.tag_name || github.ref_name }}"
            MESSAGE="<b>[SNPI · RELEASE] ${TAG_NAME}</b>%0A<b>Production Checkpoint Published</b>%0A%0A• <b>Developer:</b> ${DEV_NAME}%0A• <b>Package:</b> <code>v${PKG_VERSION}</code>%0A• <b>Security:</b> ${SEC_SUMMARY}%0A• <b>Tracker:</b> <a href=\"https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME}\">View Release Notes</a>%0A• <b>Time:</b> ${HUMAN_TIME}"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            PR_NUM="${{ github.event.pull_request.number }}"
            PR_TITLE="${{ github.event.pull_request.title }}"
            PR_ACTION="${{ github.event.action }}"
            MESSAGE="<b>[SNPI · PR #${PR_NUM}] ${PR_ACTION^^}</b>%0A<b>${PR_TITLE}</b>%0A%0A• <b>Developer:</b> ${{ github.event.pull_request.user.login }}%0A• <b>Branch:</b> <code>${{ github.event.pull_request.head.ref }}</code> &rarr; <code>${{ github.event.pull_request.base.ref }}</code>%0A• <b>Tracker:</b> <a href=\"https://github.com/${{ github.repository }}/pull/${PR_NUM}\">View Pull Request</a>%0A• <b>Time:</b> ${HUMAN_TIME}"
          elif [ "$EVENT_NAME" = "workflow_run" ]; then
            CONCLUSION="${{ github.event.workflow_run.conclusion }}"
            MESSAGE="<b>[SNPI · CI ${CONCLUSION^^}] ${{ github.event.workflow_run.name }}</b>%0A<b>Monorepo Automated Verification Gate</b>%0A%0A• <b>Developer:</b> ${DEV_NAME}%0A• <b>Commit:</b> <code>${SHORT_HASH}</code>%0A• <b>Security:</b> ${SEC_SUMMARY}%0A• <b>Tracker:</b> Automated CI Pipeline%0A• <b>Time:</b> ${HUMAN_TIME}"
          else
            MESSAGE="<b>[SNPI · REPO PUSH]</b> <code>${{ github.ref_name }}</code> · <b>v${PKG_VERSION}</b>%0A<b>${COMMIT_MSG}</b>%0A%0A• <b>Developer:</b> ${DEV_NAME}%0A• <b>Commit:</b> <code>${SHORT_HASH}</code>%0A• <b>Security:</b> ${SEC_SUMMARY}%0A• <b>Tracker:</b> GitHub Actions Push Sync%0A• <b>Time:</b> ${HUMAN_TIME}"
          fi

          # 5. Dispatch to Telegram
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" >/dev/null
          echo "Telegram notification sent successfully to chat ${TELEGRAM_CHAT_ID}."
