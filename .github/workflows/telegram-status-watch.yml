name: Telegram Repository Status & Security Watcher

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_run:
    workflows: ['Security & Compliance Audit']
    types: [completed]

permissions:
  contents: read
  security-events: read

jobs:
  telegram-alert:
    name: Dispatch Telegram Real-Time Alert
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract Metadata & Dispatch Alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '***REMOVED***' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Resolve Version from package.json
          PKG_VERSION=$(node -p "require('./package.json').version || '0.0.0'")

          # 2. Resolve Developer & Commit Info
          COMMIT_HASH="${{ github.sha }}"
          SHORT_HASH="${COMMIT_HASH:0:7}"
          DEV_NAME="${{ github.event.head_commit.author.name || github.actor }}"
          DEV_EMAIL="${{ github.event.head_commit.author.email || 'developer@snpi.edu.kh' }}"
          RAW_MSG="${{ github.event.head_commit.message || 'Automated repository workflow sync' }}"
          COMMIT_MSG=$(echo "$RAW_MSG" | head -n 1)

          # 3. Resolve Security Quality Alerts (Dependabot)
          OPEN_ALERTS=0
          if command -v gh >/dev/null 2>&1; then
            OPEN_ALERTS=$(gh api "repos/${{ github.repository }}/dependabot/alerts" --jq '[.[] | select(.state=="open")] | length' 2>/dev/null || echo "0")
          fi

          # 4. Determine Event Type & Format Payload
          EVENT_NAME="${{ github.event_name }}"

          if [ "$EVENT_NAME" = "release" ]; then
            TAG_NAME="${{ github.event.release.tag_name || github.ref_name }}"
            MESSAGE="<b>[SNPI NEW VERSION RELEASE]</b>%0A<b>Release Tag:</b> ${TAG_NAME}%0A<b>Package Version:</b> v${PKG_VERSION}%0A<b>Publisher:</b> ${DEV_NAME}%0A<b>URL:</b> https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME}%0A<b>Security Status:</b> ${OPEN_ALERTS} open alerts%0A<b>Timestamp:</b> $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          elif [ "$EVENT_NAME" = "workflow_run" ]; then
            CONCLUSION="${{ github.event.workflow_run.conclusion }}"
            MESSAGE="<b>[SNPI SECURITY AUDIT COMPLETED]</b>%0A<b>Workflow:</b> ${{ github.event.workflow_run.name }}%0A<b>Result:</b> ${CONCLUSION}%0A<b>Dependabot Open Alerts:</b> ${OPEN_ALERTS}%0A<b>Commit:</b> <code>${SHORT_HASH}</code>%0A<b>Developer:</b> ${DEV_NAME}%0A<b>Timestamp:</b> $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          else
            MESSAGE="<b>[SNPI REPO PUSH &amp; FIX ALERT]</b>%0A<b>Developer:</b> ${DEV_NAME} &lt;${DEV_EMAIL}&gt;%0A<b>Branch:</b> <code>${{ github.ref_name }}</code>%0A<b>Commit:</b> <code>${SHORT_HASH}</code>%0A<b>Message:</b> ${COMMIT_MSG}%0A<b>System Version:</b> v${PKG_VERSION}%0A<b>Security Quality:</b> ${OPEN_ALERTS} open alerts%0A<b>Timestamp:</b> $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          fi

          # 5. Dispatch to Telegram (if Chat ID configured)
          if [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=${MESSAGE}" \
              -d "parse_mode=HTML" \
              -d "disable_web_page_preview=true" >/dev/null
            echo "Telegram notification sent successfully to chat ${TELEGRAM_CHAT_ID}."
          else
            echo "Notice: TELEGRAM_CHAT_ID not configured in GitHub Secrets. Skipping cloud notification."
          fi
