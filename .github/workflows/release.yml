name: Release Checkpoint

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## SNP-SMS Monorepo Release ${{ github.ref_name }}

            Refer to [CHANGELOG.md](https://github.com/shiliaiwei/SNP-SMS/blob/main/CHANGELOG.md) for full change history.

            ### Verification Status
            - All 47 modular monolith backend domain modules tested and verified.
            - Next.js Light Mode enterprise UI verified.
            - MongoDB Replica Set (`rs0`) ACID transaction integrity validated.
          draft: false
          prerelease: false
