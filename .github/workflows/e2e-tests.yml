name: End-to-End API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-api-tests:
    name: 47 Domain Modules E2E API Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Spin Up MongoDB Replica Set (rs0)
        run: |
          docker run -d --name mongodb -p 27017:27017 mongo:7.0 mongod --replSet rs0 --bind_ip_all
          until docker exec mongodb mongosh --eval "db.adminCommand('ping')" > /dev/null 2>&1; do
            echo "Waiting for MongoDB engine to start..."
            sleep 1
          done
          docker exec mongodb mongosh --eval "rs.initiate({_id: 'rs0', members: [{_id: 0, host: '127.0.0.1:27017'}]})"
          echo "MongoDB rs0 initialized successfully."

      - name: Start Backend API Daemon
        run: |
          cd apps/backend
          npm run dev &
          until curl -s http://127.0.0.1:4000/api/v1/health > /dev/null; do
            echo "Waiting for backend API on port 4000..."
            sleep 1
          done
          echo "Backend API is online and responding."
        env:
          NODE_ENV: development
          PORT: 4000
          MONGODB_URI: 'mongodb://127.0.0.1:27017/snp_sms?replicaSet=rs0&directConnection=true'
          SUPER_ADMIN_USERNAME: admin_local
          SUPER_ADMIN_PASSWORD: ***REMOVED***

      - name: Execute Comprehensive E2E API Test Suite
        run: npm run test:api
        env:
          SUPER_ADMIN_USERNAME: admin_local
          SUPER_ADMIN_PASSWORD: ***REMOVED***
