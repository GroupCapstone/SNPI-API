name: End-to-End API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-api-tests:
    name: 47 Domain Modules E2E API Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Spin Up MongoDB Replica Set (rs0)
        run: |
          docker run -d --name mongodb -p 27017:27017 mongo:7.0 mongod --replSet rs0 --bind_ip_all
          until docker exec mongodb mongosh --eval "db.adminCommand('ping')" > /dev/null 2>&1; do
            echo "Waiting for MongoDB engine to start..."
            sleep 1
          done
          docker exec mongodb mongosh --eval "rs.initiate({_id: 'rs0', members: [{_id: 0, host: '127.0.0.1:27017'}]})"
          echo "MongoDB rs0 initialized successfully."

      - name: Start Backend API Daemon
        run: |
          npx tsx src/server.ts > /tmp/backend.log 2>&1 &
          SERVER_PID=$!
          echo "Backend Daemon started with PID: $SERVER_PID"
          for i in $(seq 1 45); do
            if curl -s http://127.0.0.1:4000/api/v1/health > /dev/null 2>&1; then
              echo "Backend API is online and responding."
              exit 0
            fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "[ERROR] Backend API process died prematurely. Process output:"
              cat /tmp/backend.log
              exit 1
            fi
            echo "Waiting for backend API on port 4000 ($i/45)..."
            sleep 1
          done
          echo "[ERROR] Timeout waiting for backend API to start. Process output:"
          cat /tmp/backend.log
          exit 1
        env:
          NODE_ENV: development
          PORT: 4000
          MONGODB_URI: 'mongodb://127.0.0.1:27017/snpi_sms?replicaSet=rs0&directConnection=true'
          SUPER_ADMIN_USERNAME: admin_local
          # CI-only throwaway values for the ephemeral test database.
          # They protect no real system and are never used in any deployment.
          JWT_ACCESS_SECRET: 'ci_access_7f3a9c1e5b8d2046a1f7c9e3b5d708192a4c6e8f0d2b'
          JWT_REFRESH_SECRET: 'ci_refresh_2e6b8d0a4f1c3957e0a2b4c6d8f0a1b3c5e709182a4c6e'
          COOKIE_SECRET: 'ci_cookie_9a1f3c5e7b0d2846f1a3c5e7b9d0f2a4c6e8b0d1f3a5c7'
          CLIENT_API_KEY: 'ci_client_key_5d2f8a1c9e7046b3a5c7'
          SUPER_ADMIN_PASSWORD: 'CiAdmin9248xkQp7zWm'

      - name: Execute Comprehensive E2E API Test Suite
        run: npm run test:api
        env:
          SUPER_ADMIN_USERNAME: admin_local
          # CI-only throwaway values for the ephemeral test database.
          # They protect no real system and are never used in any deployment.
          JWT_ACCESS_SECRET: 'ci_access_7f3a9c1e5b8d2046a1f7c9e3b5d708192a4c6e8f0d2b'
          JWT_REFRESH_SECRET: 'ci_refresh_2e6b8d0a4f1c3957e0a2b4c6d8f0a1b3c5e709182a4c6e'
          COOKIE_SECRET: 'ci_cookie_9a1f3c5e7b0d2846f1a3c5e7b9d0f2a4c6e8b0d1f3a5c7'
          CLIENT_API_KEY: 'ci_client_key_5d2f8a1c9e7046b3a5c7'
          SUPER_ADMIN_PASSWORD: 'CiAdmin9248xkQp7zWm'
