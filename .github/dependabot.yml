version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    # Security alerts remain active in GitHub Security Overview; routine version bump PRs disabled
    open-pull-requests-limit: 0
    groups:
      dependencies:
        patterns:
          - '*'
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    # Security alerts remain active in GitHub Security Overview, but automated PRs
    # are limited to 0 to prevent violating immutable full-commit SHA pinning policy.
    open-pull-requests-limit: 0

  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 0
